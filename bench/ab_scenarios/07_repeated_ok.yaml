scenario_id: "07_repeated_ok"
title: "Caller says 'ok' repeatedly while taking notes during agent reply"
description: "Caller says 'ok' twice at different points while the agent reads out checklist items. Stock Pipecat falsely interrupts twice; OVERLAP ducks and completes the full list."
lang: "en-IN"
persona_prompt: "You are a helpful Gnani banking assistant. Keep responses clear and natural."
voice_id: "gnani-timbre-en-female-1"
