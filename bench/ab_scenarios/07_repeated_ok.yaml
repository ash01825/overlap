    agent_reply: "Please bring your original PAN card, your Aadhaar card or passport for address proof, and two recent passport size photographs."
    agent_reply_duration_ms: 3800
  - kind: "user_overlap"
    at_ms: 1900
    offset_into_reply_ms: 600
    duration_ms: 180
    text: "ok"
    lang: "en-IN"
    ground_truth: "BACKCHANNEL"
  - kind: "user_overlap"
    at_ms: 3100
    offset_into_reply_ms: 1800
    duration_ms: 200
    text: "okay"
    lang: "en-IN"
    ground_truth: "BACKCHANNEL"
  - kind: "silence"
    at_ms: 5400
