scenario_id: "01_mid_reply_haan"
title: "Caller says 'haan' mid-reply (Hindi acknowledgement)"
description: "Caller asks for account status and interjects 'haan' while agent is explaining. Agent should duck briefly, classify as BACKCHANNEL, and continue uninterrupted."
lang: "hi-IN"
persona_prompt: "You are a helpful Gnani banking assistant. Keep responses clear and natural."
voice_id: "gnani-timbre-hi-female-1"
events:
  - kind: "user_utterance"
    at_ms: 0
    duration_ms: 1400
    text: "Mere savings account ka minimum balance rule kya hai?"
    lang: "hi-IN"
    agent_reply: "Aapke savings account mein har mahine das hazaar rupaye ka average balance rakhna zaroori hai warna charges lag sakte hain."
    agent_reply_duration_ms: 3200
  - kind: "user_overlap"
    at_ms: 2100
    offset_into_reply_ms: 600
    duration_ms: 220
    text: "haan"
    lang: "hi-IN"
    ground_truth: "BACKCHANNEL"
  - kind: "silence"
    at_ms: 5000
    duration_ms: 600
