[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "overlap"
version = "0.1.0"
description = "Full-duplex conversational audio pipeline on Gnani Prisma -> Evon -> Timbre"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26.0",
    "regex>=2023.12.25",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-socket>=0.7.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "import-linter>=2.0",
    "numpy>=1.26.0",
    "regex>=2023.12.25",
    "pyyaml>=6.0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["overlap*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that take > 1 s (excluded from fast suite)",
    "live: tests hitting external networks or live services (human-triggered)",
    "replay: tests that replay wire traces",
    "bench: benchmark tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
